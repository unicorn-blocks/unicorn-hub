[[plugins]]
  package = "@netlify/plugin-nextjs"

[build]
  command = "npm run build"
  publish = ".next"

# 启用自动图片优化和压缩
[build.processing]
  skip_processing = false

[build.processing.images]
  compress = true

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

# 图片缓存配置 - 12小时
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=43200"

[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=43200"
    
[[headers]]
  for = "*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=43200"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=43200"

[[headers]]
  for = "*.gif"
  [headers.values]
    Cache-Control = "public, max-age=43200"

[[headers]]
  for = "*.svg"
  [headers.values]
    Cache-Control = "public, max-age=43200"

[[headers]]
  for = "*.webp"
  [headers.values]
    Cache-Control = "public, max-age=43200"
